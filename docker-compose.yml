services:
  db:
    image: postgres:17-alpine
    profiles: [legacy-db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      ORIGIN: ${ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      NUTRITION_AI_RATE_LIMIT: ${NUTRITION_AI_RATE_LIMIT:-10}
      NUTRITION_PRIVATE_DIR: /app/private/nutrition
      NUTRITION_ANALYSIS_LOG: /app/logs/nutrition-analysis.jsonl
      APP_VERSION: ${APP_VERSION:-local}
      UPLOAD_DIR: /app/uploads
      PORT: 3000
    volumes:
      - uploads:/app/uploads
      - nutrition_private:/app/private/nutrition
      - analysis_logs:/app/logs
    ports:
      - "127.0.0.1:${APP_PORT:-3210}:3000"
    networks: [internal]
  seed:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    profiles: [seed]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
    command: ["sh","-c","npm exec -w @kir-fit/api -- prisma migrate deploy --schema prisma/schema.prisma && npm exec -w @kir-fit/api -- tsx prisma/seed.ts"]
    networks: [internal]
volumes:
  postgres_data:
  uploads:
  nutrition_private:
  analysis_logs:
networks:
  internal:
    ipam:
      config:
        - subnet: 172.29.21.0/24
          gateway: 172.29.21.1
